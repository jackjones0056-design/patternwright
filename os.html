<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Patternwright OS</title>
<style>html,body{margin:0;min-height:100%;background:#f7f9fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0b1220}.boot{min-height:100vh;display:grid;place-items:center}.boot div{display:flex;align-items:center;gap:10px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#168de2;box-shadow:0 0 0 6px rgba(22,141,226,.12)}</style>
</head>
<body>
<div class="boot"><div><span class="dot"></span>Loading Patternwright OS…</div></div>
<script>
(async()=>{
  try{
    const r=await fetch('public/os.html',{cache:'no-store'});
    if(!r.ok) throw new Error('Unable to load OS');
    let h=await r.text();
    h=h
      .replaceAll('href="/assets/','href="public/assets/')
      .replaceAll('src="/assets/','src="public/assets/')
      .replaceAll('href="/css/','href="public/css/')
      .replaceAll('src="/js/','src="public/js/');
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="max-width:720px;margin:80px auto;padding:24px"><h1>Patternwright OS</h1><p>The operating console could not load. Refresh this page or try again in a moment.</p></main>';
  }
})();
</script>
</body>
</html>
